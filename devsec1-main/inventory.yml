---
# Інвентаризація пристроїв лабораторного стенду GNS3
# Адаптуйте адреси хостів відповідно до вашої топології GNS3

devices:
  - name: Router-Main
    host: 192.168.1.1
    role: main
    device_type: cisco_ios
    username: admin
    password: cisco123

  - name: Router-User
    host: 192.168.1.2
    role: user
    device_type: cisco_ios
    username: admin
    password: cisco123

  - name: Router-Attacker
    host: 192.168.1.3
    role: attacker
    device_type: cisco_ios
    username: admin
    password: cisco123

# Мережа, що використовується для побудови правил блокування ACL
attacker_network: "192.168.1.3"
attacker_wildcard: "0.0.0.0"
protected_interface: "GigabitEthernet0/0"
