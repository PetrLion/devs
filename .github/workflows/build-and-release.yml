name: Build, SBOM & Cosign Sign

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build with Make
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: build/

  sbom:
    name: Generate SBOM with Syft
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: build/

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.json

  cosign-sign:
    name: Sign with Cosign (Keyless)
    runs-on: ubuntu-latest
    needs: [build, sbom]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: build/

      - name: Download SBOM
        uses: actions/download-artifact@v3
        with:
          name: sbom
          path: sbom/

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign artifacts with Cosign (Keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          for file in build/*; do
            if [ -f "$file" ]; then
              cosign sign-blob \
                --output-signature="$file.sig" \
                --output-certificate="$file.crt" \
                "$file"
              echo "✅ Signed: $file"
            fi
          done

      - name: Upload Cosign signatures
        uses: actions/upload-artifact@v3
        with:
          name: cosign-signatures
          path: build/*.sig

      - name: Upload Cosign certificates
        uses: actions/upload-artifact@v3
        with:
          name: cosign-certificates
          path: build/*.crt

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sbom, cosign-sign]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/build-artifacts/*
            artifacts/sbom/sbom.json
            artifacts/cosign-signatures/*
            artifacts/cosign-certificates/*
          body: |
            ## Release ${{ github.ref_name }} - DevSecOps Demo
            
            - ✅ Build artifacts (signed)
            - 📋 SBOM (CycloneDX JSON)
            - 🔐 Cosign signatures & certificates
            
            ### Security Checks:
            - ✅ Scorecard results
            - ✅ Grype vulnerability scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/
