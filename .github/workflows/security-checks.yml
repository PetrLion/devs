name: Security Checks - Scorecard & Grype

on:
  push:
    branches:
      - main
      - stage
      - dev
  pull_request:
    branches:
      - main
  schedule:
    # Щодня о 6:00 UTC
    - cron: '0 6 * * *'

jobs:
  # ===== JOB 1: OpenSSF Scorecard =====
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif
          wait-for-processing: true

      - name: Upload Scorecard as artifact
        uses: actions/upload-artifact@v3
        with:
          name: scorecard-results
          path: results.sarif


  # ===== JOB 2: Generate SBOM (Syft) =====
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json
          image-scan-type: docker

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v3
        with:
          name: sbom-results
          path: sbom.json


  # ===== JOB 3: Scan SBOM with Grype =====
  grype:
    name: Scan with Grype
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v3
        with:
          name: sbom-results

      - name: Run Grype scan
        uses: anchore/grype-action@v0
        with:
          path: .
          fail-build: true
          severity-cutoff: critical
          add-cpes-if-none: true
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: grype-results.sarif
          wait-for-processing: true

      - name: Upload Grype results as artifact
        uses: actions/upload-artifact@v3
        with:
          name: grype-results
          path: grype-results.sarif
